<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PronoIA — Administration</title>
    <style>
        :root {
            --bg: #0f172a; --panel: #1e293b; --panel2: #273449;
            --text: #e2e8f0; --muted: #94a3b8; --accent: #22d3ee;
            --green: #22c55e; --yellow: #eab308; --red: #ef4444; --border: #334155;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
               background: var(--bg); color: var(--text); }
        header { background: linear-gradient(90deg, #0ea5e9, #6366f1);
                 padding: 18px 28px; display: flex; align-items: center; gap: 14px; }
        header h1 { font-size: 20px; margin: 0; }
        .layout { display: flex; min-height: calc(100vh - 60px); }
        nav { width: 220px; background: var(--panel); padding: 20px 0; }
        nav a { display: block; padding: 12px 24px; color: var(--muted);
                text-decoration: none; border-left: 3px solid transparent; }
        nav a:hover { background: var(--panel2); color: var(--text); }
        nav a.active { color: #fff; border-left-color: var(--accent); background: var(--panel2); }
        main { flex: 1; padding: 28px; }
        h2 { margin-top: 0; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                 gap: 18px; margin-bottom: 28px; }
        .card { background: var(--panel); border: 1px solid var(--border);
                border-radius: 14px; padding: 20px; }
        .card .value { font-size: 32px; font-weight: 700; color: var(--accent); }
        .card .label { color: var(--muted); font-size: 13px; text-transform: uppercase;
                       letter-spacing: .05em; }
        table { width: 100%; border-collapse: collapse; background: var(--panel);
                border-radius: 12px; overflow: hidden; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border);
                 font-size: 14px; }
        th { background: var(--panel2); color: var(--muted); text-transform: uppercase;
             font-size: 12px; letter-spacing: .04em; }
        tr:hover td { background: rgba(255,255,255,.02); }
        .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .badge.green { background: rgba(34,197,94,.15); color: var(--green); }
        .badge.red { background: rgba(239,68,68,.15); color: var(--red); }
        .badge.yellow { background: rgba(234,179,8,.15); color: var(--yellow); }
        .muted { color: var(--muted); }
    </style>
</head>
<body>
    <header>
        <span style="font-size:26px;">⚽🤖</span>
        <h1>PronoIA — Administration</h1>
    </header>
    <div class="layout">
        <nav>
            <a href="/" class="{{ 'active' if active=='dashboard' else '' }}">📊 Tableau de bord</a>
            <a href="/users" class="{{ 'active' if active=='users' else '' }}">👥 Utilisateurs</a>
            <a href="/matches" class="{{ 'active' if active=='matches' else '' }}">⚽ Matchs & IA</a>
            <a href="/payments" class="{{ 'active' if active=='payments' else '' }}">💳 Paiements</a>
        </nav>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
